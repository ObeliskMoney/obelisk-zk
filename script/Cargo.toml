[package]
name = "obelisk-prover"
version = "0.1.0"
edition = "2021"
default-run = "obelisk-prover"

[[bin]]
name = "obelisk-prover"
path = "src/bin/main.rs"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
obelisk-policy = { path = "../lib" }
dotenv = "0.15"

